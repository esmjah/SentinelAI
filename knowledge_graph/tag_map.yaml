# Digital-twin signal -> tag external_id -> graph node.
# Single source of truth for the data adapter: digital_twin.sensors.DEFAULT_SENSORS produces the
# measured and manual tags; the twin's own outputs become virtual tags.
schema_version: "1.0.0"
well: W01
tags:
  # ---------------- measured (sensor -> tag) ----------------
  - {external_id: W01-PT-WH, twin_signal: P_wh, unit: bar, kind: measured, sigma: 0.5,
     sensor: SEN-W01-PT-WH, installed_on: W01.XT, measures: {node: W01.BORE, property: pressure, location: wellhead}}
  - {external_id: W01-TT-WH, twin_signal: T_wh, unit: degC, kind: measured, sigma: 0.3,
     sensor: SEN-W01-TT-WH, installed_on: W01.XT, measures: {node: W01.BORE, property: temperature, location: wellhead}}
  - {external_id: W01-ZT-CHK, twin_signal: choke, unit: 1/64in, kind: measured, sigma: 0.2,
     sensor: SEN-W01-ZT-CHK, installed_on: W01.CHK, measures: {node: W01.CHK, property: position, location: actuator}}
  - {external_id: W01-FL-PT, twin_signal: P_fl, unit: bar, kind: measured, sigma: 0.5,
     sensor: SEN-W01-FL-PT, installed_on: FL-W01, measures: {node: FL-W01, property: pressure, location: downstream_choke}}
  - {external_id: W01-PT-DHG, twin_signal: P_dhg, unit: bar, kind: measured, sigma: 0.1,
     sensor: SEN-W01-PT-DHG, installed_on: W01.TUB, measures: {node: W01.BORE, property: pressure, location: 2250 m}}
  - {external_id: W01-TT-DHG, twin_signal: T_dhg, unit: degC, kind: measured, sigma: 0.1,
     sensor: SEN-W01-TT-DHG, installed_on: W01.TUB, measures: {node: W01.BORE, property: temperature, location: 2250 m}}
  - {external_id: W01-FT-LIQ, twin_signal: q_liq, unit: Sm3/d, kind: measured, rel_sigma: 0.03,
     sensor: SEN-W01-MPFM, installed_on: FL-W01, measures: {node: W01, property: liquid_rate, location: multiphase meter}}
  - {external_id: W01-FT-GAS, twin_signal: q_gas_sc, unit: Sm3/d, kind: measured, rel_sigma: 0.05,
     sensor: SEN-W01-MPFM, installed_on: FL-W01, measures: {node: W01, property: gas_rate, location: multiphase meter}}
  - {external_id: W01-PT-A-ANN, twin_signal: P_A, unit: bar, kind: measured, sigma: 0.5,
     sensor: SEN-W01-PT-A-ANN, installed_on: W01.THSP, measures: {node: W01.ANN-A, property: pressure, location: wellhead}}
  - {external_id: W01-PT-B-ANN, twin_signal: P_B, unit: bar, kind: measured, sigma: 0.5,
     sensor: SEN-W01-PT-B-ANN, installed_on: W01.CHSP, measures: {node: W01.ANN-B, property: pressure, location: wellhead}}
  # ---------------- manual (bleed log, recorded during a test) ----------------
  - {external_id: W01-A-BLEED-GAS, twin_signal: bled_gas_A, unit: Sm3, kind: manual, resolution: 0.1,
     recorded_by: TEST.BLEED.A, measures: {node: W01.ANN-A, property: gas_returned, location: bleed line}}
  - {external_id: W01-A-BLEED-LIQ, twin_signal: bled_liq_A, unit: L, kind: manual, resolution: 1.0,
     recorded_by: TEST.BLEED.A, measures: {node: W01.ANN-A, property: brine_returned, location: bleed line}}
  - {external_id: W01-B-BLEED-GAS, twin_signal: bled_gas_B, unit: Sm3, kind: manual, resolution: 0.1,
     recorded_by: TEST.BLEED.B, measures: {node: W01.ANN-B, property: gas_returned, location: bleed line}}
  - {external_id: W01-B-BLEED-LIQ, twin_signal: bled_liq_B, unit: L, kind: manual, resolution: 1.0,
     recorded_by: TEST.BLEED.B, measures: {node: W01.ANN-B, property: brine_returned, location: bleed line}}
  # ---------------- virtual (twin output) ----------------
  - {external_id: W01-VT-P-A-EXP, twin_signal: P_A, unit: bar, kind: virtual, sigma: 3.0,
     estimates: {node: W01.ANN-A, property: expected_pressure, location: wellhead}}
  - {external_id: W01-VT-P-B-EXP, twin_signal: P_B, unit: bar, kind: virtual, sigma: 3.0,
     estimates: {node: W01.ANN-B, property: expected_pressure, location: wellhead}}
  - {external_id: W01-VT-T-A, twin_signal: T_A, unit: degC, kind: virtual, sigma: 2.0,
     estimates: {node: W01.ANN-A, property: temperature, location: mean}}
  - {external_id: W01-VT-T-B, twin_signal: T_B, unit: degC, kind: virtual, sigma: 3.0,
     estimates: {node: W01.ANN-B, property: temperature, location: mean}}
  - {external_id: W01-VT-Q-LIQ-EXP, twin_signal: q_liq, unit: Sm3/d, kind: virtual, sigma: 15.0,
     estimates: {node: W01, property: expected_liquid_rate, location: choke model}}
  - {external_id: W01-VT-P-DHG-EXP, twin_signal: P_dhg, unit: bar, kind: virtual, sigma: 2.0,
     estimates: {node: W01.BORE, property: expected_pressure, location: 2250 m}}
  - {external_id: W01-VT-MAASP-A, twin_signal: MAASP_A, unit: bar, kind: virtual, sigma: 10.0,
     estimates: {node: W01.ANN-A, property: operational_maasp, location: wellhead}}
  - {external_id: W01-VT-MAASP-B, twin_signal: MAASP_B, unit: bar, kind: virtual, sigma: 10.0,
     estimates: {node: W01.ANN-B, property: operational_maasp, location: wellhead}}
  - {external_id: W01-VT-MARGIN-A, twin_signal: margin_A, unit: bar, kind: virtual, sigma: 10.0,
     estimates: {node: W01.ANN-A, property: margin_to_maasp, location: wellhead}}
  - {external_id: W01-VT-MARGIN-B, twin_signal: margin_B, unit: bar, kind: virtual, sigma: 10.0,
     estimates: {node: W01.ANN-B, property: margin_to_maasp, location: wellhead}}
